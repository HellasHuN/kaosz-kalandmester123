name: PR verification

on: pull_request

permissions:
  contents: read

jobs:
  verify:
    name: Test, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        id: install
      - run: npm test
      - run: npm run build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
